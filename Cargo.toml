[package]
name = "novel-quill-studio"
version = "0.1.0"
edition = "2024"
description = "A local-first Markdown novel writer with Ollama assistance"
license = "MIT"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true

