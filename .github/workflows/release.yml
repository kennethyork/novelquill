name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: novel-quill-studio-linux-x86_64
          - os: windows-latest
            artifact: novel-quill-studio-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - run: cargo test --locked
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build AppImage and Debian installers
        if: runner.os == 'Linux'
        run: cargo packager --release --formats appimage,deb
      - name: Build NSIS and MSI installers
        if: runner.os == 'Windows'
        run: cargo packager --release --formats nsis,wix
      - name: Authenticode-sign Windows installers when a certificate is configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No signing certificate configured; publishing unsigned installers."
            exit 0
          }
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem dist -Recurse -Include *.exe,*.msi | ForEach-Object {
            signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item certificate.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest with GitHub OIDC
        run: cosign sign-blob --yes --bundle CHECKSUMS.txt.sigstore.json CHECKSUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            CHECKSUMS.txt
            CHECKSUMS.txt.sigstore.json
